<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- 모바일 풀스크린 설정 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <meta name="theme-color" content="#000000">
    <meta name="format-detection" content="telephone=no">

    <!-- Android 풀스크린 설정 -->
    <meta name="full-screen" content="yes">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">

    <!-- 추가 모바일 최적화 -->
    <meta name="HandheldFriendly" content="true">
    <meta name="MobileOptimized" content="width">

    <!-- 아이콘 -->
    <link rel="apple-touch-icon" href="ico.png">
    <link rel="icon" type="image/png" href="ico.png">

    <title>잉글리쉬 탁구 헌터 J - English Ping Pong Hunter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        html {
            width: 100%;
            height: 100%;
            height: -webkit-fill-available;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        body {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            min-height: 100dvh;
            margin: 0;
            padding: 0;
            /* Safe Area Insets */
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
            touch-action: none;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8E8 50%, #7BB8D1 100%);
            overflow: hidden;
        }

        /* PC - 게임다운 전체화면 (16:9 비율 유지하면서 최대화) */
        @media (min-width: 801px) {
            body {
                background: #000;
            }

            #gameContainer {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 100vw;
                height: 100vh;
                max-width: calc(100vh * 16 / 9);
                max-height: calc(100vw * 9 / 16);
                border: none;
                border-radius: 0;
                box-shadow: 0 0 50px rgba(0,0,0,0.5);
            }
        }

        /* 모바일 - 완전 전체화면 */
        @media (max-width: 800px) {
            #gameContainer {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                height: 100dvh !important;
                max-width: 100vw !important;
                max-height: 100vh !important;
                transform: none !important;
                border: none !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                /* Safe Area aware positioning */
                padding-top: env(safe-area-inset-top, 0);
                padding-bottom: env(safe-area-inset-bottom, 0);
                padding-left: env(safe-area-inset-left, 0);
                padding-right: env(safe-area-inset-right, 0);
            }
        }

        /* 세로 모드 회전 안내 */
        #rotatePrompt {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        #rotatePrompt .rotate-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: rotate 2s infinite ease-in-out;
        }

        @keyframes rotate {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        #rotatePrompt h2 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #FFD700;
        }

        #rotatePrompt p {
            font-size: 16px;
            color: #FFFFFF;
        }

        /* 모바일 세로 모드에서 회전 안내 표시 */
        @media (max-width: 800px) and (orientation: portrait) {
            #gameContainer {
                display: none !important;
            }
            #rotatePrompt {
                display: flex !important;
            }
        }

        /* 모바일 가로 모드에서는 게임 컨테이너 보이기 */
        @media (max-width: 800px) and (orientation: landscape) {
            #gameContainer {
                display: block !important;
            }
            #rotatePrompt {
                display: none !important;
            }
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            z-index: 10;
            width: 320px;
            height: 95px;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.95) 0%, rgba(255, 218, 224, 0.95) 50%, rgba(255, 240, 245, 0.95) 100%);
            padding: 10px;
            border-radius: 20px;
            border: 4px solid #FFB6C1;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.4),
                        0 0 0 2px #FFFFFF,
                        inset 0 2px 10px rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: visible;
        }

        #ui::before {
            content: '✨';
            position: absolute;
            top: -8px;
            right: 15px;
            font-size: 20px;
            animation: sparkleUI 2s ease-in-out infinite;
        }

        #ui::after {
            content: '💖';
            position: absolute;
            bottom: -8px;
            left: 15px;
            font-size: 18px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes sparkleUI {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.3) rotate(180deg); opacity: 0.7; }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        #energyContainer {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #hpBarBackground {
            width: 200px;
            height: 30px;
            background: linear-gradient(to bottom, #FFF0F5, #FFE4E1);
            border: 3px solid #FF69B4;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1),
                        0 2px 8px rgba(255, 105, 180, 0.3);
        }

        #hpBarFill {
            height: 100%;
            width: 100%;
            background: linear-gradient(to right, #FF69B4, #FFB6C1, #FFC0CB);
            transition: width 0.3s ease, background 0.3s ease;
            box-shadow: inset 0 2px 8px rgba(255, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
        }

        #hpBarFill::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        #hpText {
            color: #FF1493;
            font-weight: bold;
            font-size: 16px;
            min-width: 80px;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8),
                         0 0 10px rgba(255, 105, 180, 0.5);
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        #playerInfo {
            color: #FF1493;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        #playerName {
            color: #FF1493;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8),
                         0 0 8px rgba(255, 105, 180, 0.4);
        }

        #playerScore {
            color: #FF69B4;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8),
                         0 0 8px rgba(255, 215, 0, 0.4);
        }

        #wordProgress {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, rgba(186, 218, 255, 0.95) 0%, rgba(224, 238, 255, 0.95) 50%, rgba(240, 248, 255, 0.95) 100%);
            padding: 10px;
            border-radius: 20px;
            border: 4px solid #87CEEB;
            box-shadow: 0 8px 20px rgba(135, 206, 235, 0.4),
                        0 0 0 2px #FFFFFF,
                        inset 0 2px 10px rgba(255, 255, 255, 0.6);
            color: #1E90FF;
            font-size: 14px;
            font-weight: bold;
            width: 320px;
            height: 95px;
            box-sizing: border-box;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: flex-start;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            position: relative;
            overflow: visible;
        }

        #wordProgress::before {
            content: '🌟';
            position: absolute;
            top: -8px;
            left: 15px;
            font-size: 20px;
            animation: starTwinkle 2s ease-in-out infinite;
        }

        #wordProgress::after {
            content: '🎀';
            position: absolute;
            bottom: -8px;
            right: 15px;
            font-size: 18px;
            animation: ribbonFloat 2.5s ease-in-out infinite;
        }

        @keyframes starTwinkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.3) rotate(180deg); opacity: 0.7; }
        }

        @keyframes ribbonFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(10deg); }
        }

        /* 퀴즈/보스 모드 - 모바일에서는 상단 중앙에 작게 표시 */
        #wordProgress.quiz-mode,
        #wordProgress.boss-mode {
            position: fixed !important;
            z-index: 5 !important;
            background: linear-gradient(135deg, rgba(255, 218, 224, 0.95) 0%, rgba(255, 182, 193, 0.95) 50%, rgba(255, 192, 203, 0.95) 100%) !important;
            border: 4px solid #FF69B4 !important;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.5),
                        0 0 0 2px #FFFFFF,
                        inset 0 2px 10px rgba(255, 255, 255, 0.6) !important;
        }

        #wordProgress.quiz-mode::before,
        #wordProgress.boss-mode::before {
            content: '👑';
        }

        #wordProgress.quiz-mode::after,
        #wordProgress.boss-mode::after {
            content: '💝';
        }

        /* PC에서는 우측 상단 유지 */
        @media (min-width: 801px) {
            #wordProgress.quiz-mode,
            #wordProgress.boss-mode {
                left: auto !important;
                right: 10px !important;
                top: 10px !important;
                bottom: auto !important;
                transform: none !important;
                max-width: 300px !important;
                text-align: left !important;
                font-size: 16px !important;
                padding: 10px 15px !important;
            }
        }

        /* 모바일에서는 상단 중앙에 컴팩트하게 표시 */
        @media (max-width: 800px) {
            #wordProgress.quiz-mode,
            #wordProgress.boss-mode {
                left: 50% !important;
                right: auto !important;
                top: env(safe-area-inset-top, 5px) !important;
                bottom: auto !important;
                transform: translateX(-50%) !important;
                max-width: 90% !important;
                text-align: center !important;
                font-size: 12px !important;
                padding: 6px 10px !important;
                background: rgba(0, 0, 0, 0.85) !important;
                border: 2px solid #FFD700 !important;
                align-items: center !important;
            }

            /* 가로 모드 모바일에서 더 작게 */
            @media (orientation: landscape) {
                #wordProgress.quiz-mode,
                #wordProgress.boss-mode {
                    font-size: 11px !important;
                    padding: 4px 8px !important;
                    max-width: 250px !important;
                }
            }
        }

        #stageDisplay {
            color: #FF1493;
            font-size: 14px;
            margin-bottom: 3px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8),
                         0 0 10px rgba(255, 105, 180, 0.5);
        }

        #targetWord {
            color: #FF69B4;
            font-size: 16px;
            margin-bottom: 3px;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8),
                         0 0 10px rgba(255, 215, 0, 0.4);
        }

        #collectedLetters {
            color: #9370DB;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8),
                         0 0 8px rgba(147, 112, 219, 0.4);
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: white;
            display: none;
            z-index: 100;
        }

        #gameOver h2 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #FF4444;
        }

        #gameOver.success h2 {
            color: #00FF00;
        }

        #gameOver p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        #gameOver button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            pointer-events: all;
            transition: all 0.3s;
        }

        #gameOver button:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        /* 오프닝 타이틀 화면 */
        #titleScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
            overflow: hidden;
        }

        #titleScreen::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 105, 180, 0.2) 0%, transparent 50%),
                radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 50px 50px;
            animation: moveBackground 20s linear infinite;
        }

        @keyframes moveBackground {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* 떠다니는 별 효과 */
        #titleScreen::after {
            content: '✨';
            position: absolute;
            font-size: 30px;
            animation: floatingStar 5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes floatingStar {
            0%, 100% {
                top: 10%;
                left: 15%;
                opacity: 0.5;
                transform: scale(0.8) rotate(0deg);
            }
            25% {
                top: 20%;
                left: 25%;
                opacity: 1;
                transform: scale(1.2) rotate(90deg);
            }
            50% {
                top: 15%;
                left: 20%;
                opacity: 0.7;
                transform: scale(1) rotate(180deg);
            }
            75% {
                top: 25%;
                left: 10%;
                opacity: 0.9;
                transform: scale(1.1) rotate(270deg);
            }
        }

        .title-container {
            position: relative;
            text-align: center;
            z-index: 1;
            animation: fadeInScale 1.5s ease-out;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.4);
            }
            100% {
                opacity: 1;
                transform: scale(0.5);
            }
        }

        .title-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
        }

        .main-title {
            position: relative;
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .title-eng {
            font-size: clamp(14px, 3.6vw, 38px);
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8),
                         3px 3px 6px rgba(0, 0, 0, 0.8);
            letter-spacing: clamp(1px, 0.4vw, 6px);
            animation: glow 2s ease-in-out infinite;
            word-break: keep-all;
            white-space: nowrap;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 3px 3px 6px rgba(0, 0, 0, 0.8); }
            50% { text-shadow: 0 0 40px rgba(255, 215, 0, 1), 3px 3px 6px rgba(0, 0, 0, 0.8); }
        }

        .title-main {
            font-size: clamp(26px, 5.6vw, 67px);
            background: linear-gradient(45deg, #fff, #BA55D3, #FF69B4, #FFD700);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
            animation: gradientMove 3s ease infinite;
            letter-spacing: clamp(0px, 0.3vw, 4px);
            word-break: keep-all;
            white-space: nowrap;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .title-j {
            font-size: clamp(38px, 7.2vw, 96px);
            color: #FF69B4;
            text-shadow: 0 0 30px rgba(255, 105, 180, 0.8),
                         5px 5px 10px rgba(0, 0, 0, 0.8);
            animation: bounce 1.5s ease-in-out infinite;
            word-break: keep-all;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .title-subtitle {
            font-size: clamp(11px, 2.4vw, 22px);
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 24px;
            letter-spacing: clamp(0px, 0.2vw, 2px);
            word-break: keep-all;
            white-space: nowrap;
        }

        .title-sparkles {
            font-size: 38px;
            margin-bottom: 32px;
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .title-sparkles span {
            display: inline-block;
            animation: sparkle 1.5s ease-in-out infinite;
        }

        .title-sparkles span:nth-child(1) { animation-delay: 0s; }
        .title-sparkles span:nth-child(2) { animation-delay: 0.2s; }
        .title-sparkles span:nth-child(3) { animation-delay: 0.4s; }
        .title-sparkles span:nth-child(4) { animation-delay: 0.6s; }

        @keyframes sparkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.3) rotate(180deg); opacity: 0.7; }
        }

        .title-start-btn {
            position: relative;
            background: linear-gradient(45deg, #FF69B4, #BA55D3);
            border: 3px solid #FFD700;
            color: white;
            font-size: 26px;
            font-weight: bold;
            padding: 16px 48px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6),
                        0 8px 20px rgba(0, 0, 0, 0.5);
            animation: buttonPulse 2s ease-in-out infinite;
        }

        @keyframes buttonPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 215, 0, 0.6), 0 8px 20px rgba(0, 0, 0, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(255, 215, 0, 1), 0 12px 25px rgba(0, 0, 0, 0.6); }
        }

        .title-start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px rgba(255, 215, 0, 1),
                        0 12px 30px rgba(0, 0, 0, 0.7);
        }

        .title-start-btn:active {
            transform: scale(0.95);
        }

        .btn-text {
            position: relative;
            z-index: 2;
            letter-spacing: 3px;
        }

        .btn-glow {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            animation: slideGlow 3s ease-in-out infinite;
        }

        @keyframes slideGlow {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        .title-description {
            font-size: clamp(9px, 1.8vw, 16px);
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            font-style: italic;
            letter-spacing: clamp(0px, 0.15vw, 1px);
            word-break: keep-all;
            white-space: nowrap;
        }

        .title-hint {
            margin-top: 12px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .title-credit {

<body>
    <!-- 세로 모드 회전 안내 -->
    <div id="rotatePrompt">

        <!-- 모바일 조이스틱 -->

            <div class="joystick-container" id="joystickContainer">
                <div class="joystick-base"></div>
                <div class="joystick-stick" id="joystickStick"></div>
            </div>
            <div class="action-buttons">
                <button id="characterBtn" class="action-btn">
                    <span>👥</span>
                    <div class="btn-label">캐릭터 체인지</div>
                </button>
                <button id="swordBtn" class="action-btn">
                    <span>⚔️</span>
                    <div class="btn-label">공격</div>
                </button>
                <button id="ballBtn" class="action-btn hidden">
                    <span>🏓</span>
                    <div class="btn-label">탁구공</div>
                </button>
            </div>
        </div>
    </div>

    <script>
        // 풀스크린 제어 - iOS와 Android 모두 지원 (모든 화면에서 가로=풀스크린, 세로=일반)
        (function() {
            // iOS 감지
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            // Android 감지
            const isAndroid = /Android/.test(navigator.userAgent);
            // 모바일 여부 확인
            const isMobile = isIOS || isAndroid;

            if (isMobile) {
                let isHandlingOrientation = false;

                // 화면 방향 감지 및 풀스크린 처리
                function handleOrientation() {
                    if (isHandlingOrientation) return;
                    isHandlingOrientation = true;

                    // 가로 모드인지 확인 - 다양한 방법으로 체크
                    const isLandscape = window.innerWidth > window.innerHeight ||
                                       screen.orientation?.type?.includes('landscape') ||
                                       window.orientation === 90 ||
                                       window.orientation === -90;

                    console.log('화면 방향:', isLandscape ? '가로' : '세로');

                    if (isLandscape) {
                        // 가로 모드: 풀스크린 요청
                        requestFullscreen();
                    } else {
                        // 세로 모드: 풀스크린 해제
                        exitFullscreen();
                    }

                    setTimeout(() => {
                        isHandlingOrientation = false;
                    }, 200);
                }

                // 풀스크린 요청 함수 (크로스 브라우저 지원)
                function requestFullscreen() {
                    const elem = document.documentElement;

                    // 이미 풀스크린이면 리턴
                    if (document.fullscreenElement ||
                        document.webkitFullscreenElement ||
                        document.mozFullScreenElement ||
                        document.msFullscreenElement) {
                        console.log('이미 풀스크린 상태');
                        applyFullscreenStyles();
                        return;
                    }

                    console.log('풀스크린 요청 시작');

                    // 다양한 브라우저 API 시도
                    try {
                        if (elem.requestFullscreen) {
                            elem.requestFullscreen().then(() => {
                                console.log('풀스크린 성공 (standard)');
                                applyFullscreenStyles();
                            }).catch(err => {
                                console.log('풀스크린 요청 실패 (standard):', err.message);
                                applyFullscreenStyles(); // 실패해도 스타일 적용
                            });
                        } else if (elem.webkitRequestFullscreen) { // iOS Safari, Chrome
                            elem.webkitRequestFullscreen();
                            console.log('풀스크린 요청 (webkit)');
                            setTimeout(applyFullscreenStyles, 100);
                        } else if (elem.webkitEnterFullscreen) { // iOS 구형
                            elem.webkitEnterFullscreen();
                            console.log('풀스크린 요청 (webkit legacy)');
                            setTimeout(applyFullscreenStyles, 100);
                        } else if (elem.mozRequestFullScreen) { // Firefox
                            elem.mozRequestFullScreen();
                            console.log('풀스크린 요청 (moz)');
                            setTimeout(applyFullscreenStyles, 100);
                        } else if (elem.msRequestFullscreen) { // IE/Edge
                            elem.msRequestFullscreen();
                            console.log('풀스크린 요청 (ms)');
                            setTimeout(applyFullscreenStyles, 100);
                        } else {
                            // API가 없어도 CSS로 풀스크린처럼 보이도록
                            console.log('풀스크린 API 없음, CSS로 대체');
                            applyFullscreenStyles();
                        }
                    } catch (err) {
                        console.error('풀스크린 요청 중 에러:', err);
                        applyFullscreenStyles(); // 에러 발생해도 스타일 적용
                    }

                    // iOS의 경우 viewport 메타 태그 동적 조정
                    if (isIOS) {
                        const viewport = document.querySelector('meta[name=viewport]');
                        if (viewport) {
                            viewport.setAttribute('content',
                                'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
                        }

                        // iOS에서 주소창 숨기기 (스크롤 트릭)
                        setTimeout(() => {
                            window.scrollTo(0, 1);
                        }, 100);
                    }
                }

                // 풀스크린 해제 함수 (크로스 브라우저 지원)
                function exitFullscreen() {
                    // 풀스크린이 아니면 리턴
                    if (!document.fullscreenElement &&
                        !document.webkitFullscreenElement &&
                        !document.mozFullScreenElement &&
                        !document.msFullscreenElement) {
                        console.log('이미 풀스크린 아님');
                        removeFullscreenStyles();
                        return;
                    }

                    console.log('풀스크린 해제 시작');

                    // 다양한 브라우저 API 시도
                    try {
                        if (document.exitFullscreen) {
                            document.exitFullscreen().then(() => {
                                console.log('풀스크린 해제 성공');
                                removeFullscreenStyles();
                            }).catch(err => {
                                console.log('풀스크린 해제 실패:', err.message);
                                removeFullscreenStyles();
                            });
                        } else if (document.webkitExitFullscreen) {
                            document.webkitExitFullscreen();
                            setTimeout(removeFullscreenStyles, 100);
                        } else if (document.webkitCancelFullScreen) { // iOS 구형
                            document.webkitCancelFullScreen();
                            setTimeout(removeFullscreenStyles, 100);
                        } else if (document.mozCancelFullScreen) { // Firefox
                            document.mozCancelFullScreen();
                            setTimeout(removeFullscreenStyles, 100);
                        } else if (document.msExitFullscreen) { // IE/Edge
                            document.msExitFullscreen();
                            setTimeout(removeFullscreenStyles, 100);
                        } else {
                            removeFullscreenStyles();
                        }
                    } catch (err) {
                        console.error('풀스크린 해제 중 에러:', err);
                        removeFullscreenStyles();
                    }

                    // iOS의 경우 원래 viewport로 복원
                    if (isIOS) {
                        const viewport = document.querySelector('meta[name=viewport]');
                        if (viewport) {
                            viewport.setAttribute('content',
                                'width=device-width, initial-scale=1.0, viewport-fit=cover');
                        }
                    }
                }

                // 풀스크린 스타일 적용 (CSS로 강제)
                function applyFullscreenStyles() {
                    document.body.style.position = 'fixed';
                    document.body.style.top = '0';
                    document.body.style.left = '0';
                    document.body.style.width = '100vw';
                    document.body.style.height = '100vh';
                    document.body.style.overflow = 'hidden';
                    document.body.style.backgroundColor = '#000';

                    // 메타 테마 색상 변경
                    const themeColor = document.querySelector('meta[name=theme-color]');
                    if (themeColor) themeColor.setAttribute('content', '#000000');

                    console.log('풀스크린 스타일 적용');
                }

                // 풀스크린 스타일 제거
                function removeFullscreenStyles() {
                    document.body.style.position = '';
                    document.body.style.top = '';
                    document.body.style.left = '';
                    document.body.style.width = '';
                    document.body.style.height = '';
                    document.body.style.overflow = '';

                    console.log('풀스크린 스타일 제거');
                }

                // 화면 방향 변경 감지
                if (screen.orientation) {
                    // 최신 API 사용
                    screen.orientation.addEventListener('change', function() {
                        console.log('Screen orientation change event');
                        setTimeout(handleOrientation, 100);
                    });
                }

                // orientationchange 이벤트 (구형 기기 호환성)
                window.addEventListener('orientationchange', function() {
                    console.log('Window orientationchange event');
                    setTimeout(handleOrientation, 100);
                });

                // resize 이벤트로도 감지 (일부 기기에서 필요)
                let resizeTimeout;
                window.addEventListener('resize', function() {
                    clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(() => {
                        console.log('Window resize event');
                        handleOrientation();
                    }, 200);
                });

                // 풀스크린 상태 변경 감지 - 사용자가 수동으로 해제할 경우 대응
                document.addEventListener('fullscreenchange', function() {
                    const isFullscreen = !!document.fullscreenElement;
                    console.log('풀스크린 상태 변경:', isFullscreen);

                    // 가로 모드인데 풀스크린이 해제되었다면 다시 요청
                    const isLandscape = window.innerWidth > window.innerHeight;
                    if (isLandscape && !isFullscreen) {
                        setTimeout(handleOrientation, 500);
                    }
                });

                document.addEventListener('webkitfullscreenchange', function() {
                    const isFullscreen = !!document.webkitFullscreenElement;
                    console.log('웹킷 풀스크린 상태 변경:', isFullscreen);

                    const isLandscape = window.innerWidth > window.innerHeight;
                    if (isLandscape && !isFullscreen) {
                        setTimeout(handleOrientation, 500);
                    }
                });

                // 첫 사용자 인터랙션 시 풀스크린 시도
                let firstInteraction = true;
                const interactionEvents = ['touchstart', 'touchend', 'click', 'keydown', 'pointerdown'];

                function onFirstInteraction(e) {
                    if (firstInteraction) {
                        firstInteraction = false;
                        console.log('첫 사용자 인터랙션 감지:', e.type);
                        handleOrientation();
                    }
                }

                // 모든 인터랙션 이벤트에 리스너 추가
                interactionEvents.forEach(event => {
                    document.addEventListener(event, onFirstInteraction, { once: true, passive: true });
                });

                // 페이지 로드 후 초기 방향 확인
                window.addEventListener('load', function() {
                    console.log('Page loaded');
                    setTimeout(handleOrientation, 500);
                });

                // DOMContentLoaded 이벤트에서도 시도
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', function() {
                        console.log('DOM Content Loaded');
                        setTimeout(handleOrientation, 300);
                    });
                } else {
                    console.log('DOM already loaded');
                    setTimeout(handleOrientation, 300);
                }

                // 주기적으로 풀스크린 상태 체크 (가로 모드일 때만)
                setInterval(function() {
                    const isLandscape = window.innerWidth > window.innerHeight;
                    if (isLandscape) {
                        const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
                        if (!isFullscreen) {
                            console.log('가로 모드인데 풀스크린 아님, 재시도');
                            applyFullscreenStyles(); // 최소한 CSS 스타일은 적용
                        }
                    }
                }, 3000); // 3초마다 체크
            }
        })();
    </script>
